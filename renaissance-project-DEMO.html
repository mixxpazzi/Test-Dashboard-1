const tlCats=()=>[...TL_CATS_BASE,...(S.customCats||[])];
const tlCatOf=id=>tlCats().find(c=>c.id===id)||TL_CATS_BASE[0];
const isFuture=e=>!!e.date&&e.date>today();
const chapterOf=date=>{ if(!date)return null;
  return (S.chapters||[]).find(c=>(!c.start||date>=c.start)&&(!c.end||date<=c.end))||null; };

function tlFields(){
  return [
   {k:'title',label:'Title',full:1,ph:'What happened?'},
   {k:'date',label:'Date',type:'date'},
   {k:'category',label:'Category',type:'select',opts:tlCats().map(c=>[c.id,c.icon+' '+c.name])},
   {k:'importance',label:'Importance (1–10)',type:'number',min:1,max:10,def:5},
   {k:'college',label:'Related Discipline',type:'select',opts:[['','—'],...COLLEGES.map(c=>[c.id,c.icon+' '+c.short])]},
   {k:'relCourse',label:'Related Course',type:'select',opts:[['','—'],...S.courses.map(c=>[c.title,c.title])]},
   {k:'relProject',label:'Related Project',type:'select',opts:[['','—'],...S.projects.map(x=>[x.name,x.name])]},
   {k:'relBook',label:'Related Book',type:'select',opts:[['','—'],...S.books.map(b=>[b.title,b.title])]},
   {k:'tags',label:'Tags (comma-separated)',csv:1},
   {k:'fav',label:'Favourite',type:'check',chk:'Mark as favourite'},
   {k:'desc',label:'Description',full:1,type:'textarea',rows:2},
   {k:'reflection',label:'Reflection',full:1,type:'textarea',rows:2},
   {k:'lessons',label:'Lessons Learned',full:1,type:'textarea',rows:2},
   {k:'files',label:'Files / Images (links or filenames — placeholder)',full:1,type:'textarea',rows:2,ph:'graduation-photo.jpg · https://…'},
   {k:'tpWhat',label:'⭐ Turning Point — What happened?',full:1,type:'textarea',rows:2,ph:'Only for Turning Points'},
   {k:'tpWhy',label:'⭐ Why was it significant?',full:1,type:'textarea',rows:2},
   {k:'tpHow',label:'⭐ How did it change my life?',full:1,type:'textarea',rows:2},
   {k:'tpLearned',label:'⭐ What did I learn?',full:1,type:'textarea',rows:2},
  ];
}
function editTLEvent(id,pre,subtitle){
  const e=id?S.timeline.find(x=>x.id===id):null;
  const obj=e?{...e,tags:(e.tags||[]).join(', ')}:(pre?{importance:5,date:today(),...pre,tags:(pre.tags||[]).join(', ')}:null);
  openModal(formHTML(e?'Edit Moment':'New Timeline Moment',
    subtitle||'A moment in the story of your life. Choose ⭐ Turning Points for the ones that changed everything.',
    tlFields(),obj,`saveTLEvent('${id||''}')`,e?`delItem('timeline','${id}')`:null,e?connHTML('timeline',e.id):''),true);
}
function saveTLEvent(id){
  const v=readForm(tlFields());
  if(!v.title.trim())return toast('A title is required','🌸');
  if(id)Object.assign(S.timeline.find(x=>x.id===id),v);
  else S.timeline.unshift({id:uid(),archived:false,auto:false,files:'',...v});
  toast(isFuture(v)?'Aspiration added to the Future Timeline':'Moment kept','🕰️');
  closeModal();touch();go('timeline');rerender();
}
function tlFav(id){const e=S.timeline.find(x=>x.id===id);e.fav=!e.fav;touch(false);rerender();}
function dupTL(id){const e=S.timeline.find(x=>x.id===id);if(!e)return;
  S.timeline.unshift({...JSON.parse(JSON.stringify(e)),id:uid(),title:e.title+' (copy)'});touch(false);toast('Duplicated','🕰️');rerender();}
function archTL(id){const e=S.timeline.find(x=>x.id===id);e.archived=!e.archived;touch(false);toast(e.archived?'Archived':'Restored','🗂️');rerender();}
function openRelated(type,title){
  if(type==='course'){const c=S.courses.find(x=>x.title===title);if(c)editCourse(c.id);}
  if(type==='project'){const x=S.projects.find(y=>y.name===title);if(x)editProject(x.id);}
  if(type==='book'){const b=S.books.find(y=>y.title===title);if(b)editBook(b.id);}
}
function offerTimeline(type,id){
  let pre=null;
  if(type==='course'){const c=S.courses.find(x=>x.id===id);if(!c)return;
    pre={title:'Completed: '+c.title,date:c.done||today(),category:'education',importance:6,college:c.college,relCourse:c.title,
      desc:'Finished '+c.title+(c.provider?' ('+c.provider+')':''),tags:['course']};}
  if(type==='book'){const b=S.books.find(x=>x.id===id);if(!b)return;
    pre={title:'Finished: '+b.title,date:b.finished||today(),category:'readingms',importance:5,college:b.college,relBook:b.title,
      desc:(b.author?'by '+b.author:''),tags:['book']};}
  if(type==='project'){const x=S.projects.find(y=>y.id===id);if(!x)return;
    pre={title:'Shipped: '+x.name,date:x.end||today(),category:'project',importance:7,college:x.college,relProject:x.name,
      desc:x.outcome||x.description||'',tags:['project']};}
  if(type==='cert'){const x=S.certs.find(y=>y.id===id);if(!x)return;
    pre={title:'Certified: '+x.title,date:x.date||today(),category:'certification',importance:7,college:x.college,
      desc:(x.provider||'')+(x.credId?' · '+x.credId:''),tags:['certificate']};}
  if(pre)editTLEvent(null,pre,'A moment worth remembering? Save it to your Life Timeline — or close if not.');
}

function tlFiltered(scope){
  let list=S.timeline.filter(e=>VS.tlArch?e.archived:!e.archived);
  if(scope==='past')list=list.filter(e=>!isFuture(e));
  if(scope==='future')list=list.filter(e=>isFuture(e));
  const q=(VS.tlQ||'').toLowerCase();
  if(q)list=list.filter(e=>(e.title+' '+(e.desc||'')+' '+(e.reflection||'')+' '+(e.lessons||'')+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q));
  if(VS.tlYear&&VS.tlYear!=='All')list=list.filter(e=>(e.date||'').slice(0,4)===VS.tlYear);
  if(VS.tlCat&&VS.tlCat!=='All')list=list.filter(e=>e.category===VS.tlCat);
  if(VS.tlChap&&VS.tlChap!=='All')list=list.filter(e=>{const c=chapterOf(e.date);return c&&c.id===VS.tlChap});
  if(VS.tlImp&&VS.tlImp!=='All')list=list.filter(e=>(+e.importance||0)>=+VS.tlImp);
  if(VS.tlCol&&VS.tlCol!=='All')list=list.filter(e=>e.college===VS.tlCol);
  if(VS.tlFav)list=list.filter(e=>e.fav);
  list.sort((a,b)=>scope==='future'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));
  return list;
}
function tlCard(e){
  const cat=tlCatOf(e.category);
  const ch=chapterOf(e.date);
  const fut=isFuture(e);
  const imp=clamp(+e.importance||5,1,10);
  const rel=[
    e.relCourse?`<span class="chip sel" onclick="event.stopPropagation();openRelated('course','${esc(e.relCourse).replace(/'/g,"\\'")}')" title="Open course">🎓 ${esc(e.relCourse)}</span>`:'',
    e.relProject?`<span class="chip sel" onclick="event.stopPropagation();openRelated('project','${esc(e.relProject).replace(/'/g,"\\'")}')" title="Open project">🛠️ ${esc(e.relProject)}</span>`:'',
    e.relBook?`<span class="chip sel" onclick="event.stopPropagation();openRelated('book','${esc(e.relBook).replace(/'/g,"\\'")}')" title="Open book">📚 ${esc(e.relBook)}</span>`:'',
    e.college?collegeChip(e.college):''
  ].join('');
  const tp=(e.category==='turning'&&(e.tpWhat||e.tpWhy||e.tpHow||e.tpLearned))?
    `<div class="tp-block">${[['What happened',e.tpWhat],['Why it was significant',e.tpWhy],['How it changed my life',e.tpHow],['What I learned',e.tpLearned]]
      .filter(x=>x[1]).map(x=>`<p class="tiny" style="margin-bottom:4px"><b>${x[0]}:</b> <span class="t2">${esc(x[1])}</span></p>`).join('')}</div>`:'';
  return `<div class="card hover tl-card ${e.category==='turning'?'turning':''} ${fut?'future-glow':''}" style="cursor:pointer" onclick="editTLEvent('${e.id}')">
    <div class="row between wrap" style="margin-bottom:7px">
      <div class="row wrap"><span class="chip tint" style="background:${cat.color}26">${cat.icon} ${esc(cat.name)}</span>
        ${ch?`<span class="tiny muted">· ${esc(ch.title)}</span>`:''}${fut?'<span class="tiny" style="color:var(--rose)">· future</span>':''}
        ${e.auto?'<span class="tiny muted">· auto</span>':''}</div>
      <div class="row"><span class="imp-dots" title="Importance ${imp}/10">${Array.from({length:10},(_,i)=>`<i class="${i<imp?'on':''}"></i>`).join('')}</span>
        <button class="btn ghost sm" onclick="event.stopPropagation();tlFav('${e.id}')" style="color:${e.fav?'var(--rose)':'var(--muted)'}">${e.fav?'♥':'♡'}</button></div></div>
    <div class="row between wrap" style="align-items:baseline"><h3 style="font-size:16.5px;line-height:1.3">${esc(e.title)}</h3>
      <span class="tiny muted" style="white-space:nowrap">${fmtDate(e.date)}</span></div>
    ${e.desc?`<p class="small t2" style="margin-top:6px;line-height:1.55">${esc(e.desc)}</p>`:''}
    ${tp}
    ${e.reflection?`<p class="tiny serif" style="font-style:italic;margin-top:8px;color:var(--text-2)">“${esc(e.reflection)}”</p>`:''}
    ${e.lessons?`<p class="tiny" style="margin-top:6px"><b>Lesson:</b> <span class="t2">${esc(e.lessons)}</span></p>`:''}
    ${e.files?`<p class="tiny muted" style="margin-top:6px">📎 ${esc(e.files)}</p>`:''}
    <div class="row wrap" style="margin-top:10px">${rel}${(e.tags||[]).map(t=>`<span class="topic-tag">#${esc(t)}</span>`).join('')}</div>
    <div class="row" style="margin-top:11px" onclick="event.stopPropagation()">
      <button class="btn ghost sm" onclick="dupTL('${e.id}')">Duplicate</button>
      <button class="btn ghost sm" onclick="archTL('${e.id}')">${e.archived?'Unarchive':'Archive'}</button></div>
  </div>`;
}
function tlItem(e){
  const cat=tlCatOf(e.category);
  return `<div class="tl-item ${isFuture(e)?'future':''}"><span class="tl-dot" style="--cc:${cat.color}"></span>${tlCard(e)}</div>`;
}

VIEWS.timeline=()=>{
  VS.tlTab=VS.tlTab||'story'; VS.tlMode=VS.tlMode||'timeline';
  const tabs=[['story','🕰️ Timeline'],['future','✨ Future Timeline'],['chapters','📖 Life Chapters'],['stats','📊 Timeline Analytics']];
  const head=pageHead('Life Timeline','The Disciplines track what I learn. This is the story of who I\'m becoming.',
    `<button class="btn primary" onclick="editTLEvent()">+ New Moment</button>`)+
  `<div class="row wrap" style="margin-bottom:20px">${tabs.map(([id,l])=>
    `<span class="chip sel ${VS.tlTab===id?'on':''}" style="padding:7px 15px" onclick="VS.tlTab='${id}';rerender()">${l}</span>`).join('')}</div>`;
  if(VS.tlTab==='future')return head+tlFutureTab();
  if(VS.tlTab==='chapters')return head+tlChaptersTab();
  if(VS.tlTab==='stats')return head+tlStatsTab();
  return head+tlStoryTab();
};
function tlStoryTab(){
  const list=tlFiltered('past');
  const years=[...new Set(S.timeline.filter(e=>e.date).map(e=>e.date.slice(0,4)))].sort().reverse();
  const modes=[['timeline','Timeline'],['year','Year'],['chapter','Chapter'],['grid','Grid']];
  const filters=`
    <select class="input" style="width:auto" onchange="VS.tlYear=this.value;rerender()">
      <option value="All">All Years</option>${years.map(y=>`<option ${VS.tlYear===y?'selected':''}>${y}</option>`).join('')}</select>
    <select class="input" style="width:auto" onchange="VS.tlCat=this.value;rerender()">
      <option value="All">All Categories</option>${tlCats().map(c=>`<option value="${c.id}" ${VS.tlCat===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
    <select class="input" style="width:auto" onchange="VS.tlChap=this.value;rerender()">
      <option value="All">All Chapters</option>${S.chapters.map(c=>`<option value="${c.id}" ${VS.tlChap===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>
    <select class="input" style="width:auto" onchange="VS.tlCol=this.value;rerender()">
      <option value="All">All Disciplines</option>${COLLEGES.map(c=>`<option value="${c.id}" ${VS.tlCol===c.id?'selected':''}>${c.icon} ${c.short}</option>`).join('')}</select>
    <select class="input" style="width:auto" onchange="VS.tlImp=this.value;rerender()">
      <option value="All">Any importance</option><option value="6" ${VS.tlImp==='6'?'selected':''}>6+</option>
      <option value="8" ${VS.tlImp==='8'?'selected':''}>8+</option><option value="10" ${VS.tlImp==='10'?'selected':''}>10 only</option></select>
    <span class="chip sel ${VS.tlFav?'on':''}" onclick="VS.tlFav=!VS.tlFav;rerender()">♥ Favourites</span>
    <button class="btn ghost sm" onclick="VS.tlArch=!VS.tlArch;rerender()">${VS.tlArch?'← Active':'Archived ▸'}</button>
    <button class="btn ghost sm" onclick="editCat()">+ Category</button>`;
  let body='';
  if(!list.length)body=emptyBox('🕰️','No moments match this view.',`<button class="btn primary" onclick="editTLEvent()">+ New Moment</button>`);
  else if(VS.tlMode==='grid')body=`<div class="grid g2">${list.map(tlCard).join('')}</div>`;
  else if(VS.tlMode==='year'){
    const byY={};list.forEach(e=>{const y=(e.date||'').slice(0,4)||'Undated';(byY[y]=byY[y]||[]).push(e)});
    body=`<div class="tl-wrap">${Object.keys(byY).sort().reverse().map(y=>
      `<div class="tl-year">${y}<span class="tiny muted" style="font-family:var(--sans)">${byY[y].length} moment${byY[y].length===1?'':'s'}</span></div>${byY[y].map(tlItem).join('')}`).join('')}</div>`;
  }
  else if(VS.tlMode==='chapter'){
    const done=new Set();
    body=S.chapters.map(ch=>{
      const evs=list.filter(e=>{const c=chapterOf(e.date);return c&&c.id===ch.id});
      evs.forEach(e=>done.add(e.id));
      if(!evs.length)return '';
      return `<div class="tl-year">${ch.cover||'📖'} ${esc(ch.title)}<span class="tiny muted" style="font-family:var(--sans)">${fmtDate(ch.start)} → ${ch.end?fmtDate(ch.end):'…'}</span></div>
        <div class="tl-wrap">${evs.map(tlItem).join('')}</div>`;
    }).join('');
    const rest=list.filter(e=>!done.has(e.id));
    if(rest.length)body+=`<div class="tl-year">🗂️ Unchaptered</div><div class="tl-wrap">${rest.map(tlItem).join('')}</div>`;
    if(!body)body=emptyBox('📖','No chapters cover these moments yet.');
  }
  else body=`<div class="tl-wrap">${list.map(tlItem).join('')}</div>`;
  return `<div class="row wrap" style="margin-bottom:14px">${modes.map(([id,l])=>
      `<span class="chip sel ${VS.tlMode===id?'on':''}" onclick="VS.tlMode='${id}';rerender()">${l} View</span>`).join('')}</div>`+
    searchBar('tlQ','Search your whole life story…',filters)+body;
}
function tlFutureTab(){
  const list=tlFiltered('future');
  return `<div class="card pad-lg fade-up d1" style="margin-bottom:20px;text-align:center;border-style:dashed">
    <p class="serif-quote t2">The future is a draft. Write it anyway.</p>
    <button class="btn primary" style="margin-top:14px" onclick="editTLEvent(null,{date:'${new Date(new Date().getFullYear()+1,0,15).toISOString().slice(0,10)}',category:'business'})">+ Add Aspiration</button></div>`+
    (list.length?`<div class="tl-wrap future">${list.map(tlItem).join('')}</div>`
    :emptyBox('✨','No future moments yet. Career goals, businesses, degrees, travel, books to write…'));
}
function tlChaptersTab(){
  return `<div class="row" style="margin-bottom:16px"><button class="btn primary" onclick="editChapter()">+ New Chapter</button></div>
  <div class="grid g2">${S.chapters.map((ch,i)=>{
    const evs=S.timeline.filter(e=>!e.archived&&chapterOf(e.date)&&chapterOf(e.date).id===ch.id);
    const grad=['#F7C8D8','#E8DFF5','#FADADD','#F3E8FA','#F7C8D8','#E8DFF5'][i%6];
    return `<div class="card hover fade-up d${(i%4)+1}" style="cursor:pointer" onclick="editChapter('${ch.id}')">
      <div class="chapter-cover" style="background:linear-gradient(135deg,${grad}66,${grad}22)">${ch.cover||'🖼️'}</div>
      <div class="row between"><h3 style="font-size:18px">${esc(ch.title)}</h3>
        <span class="tiny muted">${evs.length} moment${evs.length===1?'':'s'}</span></div>
      <div class="tiny muted" style="margin:3px 0 9px">${ch.start?fmtDate(ch.start):'…'} → ${ch.end?fmtDate(ch.end):'ongoing'}</div>
      ${ch.desc?`<p class="small t2" style="line-height:1.55">${esc(ch.desc)}</p>`:''}
      ${ch.highlights?`<p class="tiny" style="margin-top:8px"><b>✨ Highlights:</b> <span class="t2">${esc(ch.highlights)}</span></p>`:''}
      ${ch.reflections?`<p class="tiny serif" style="font-style:italic;margin-top:7px;color:var(--text-2)">“${esc(ch.reflections)}”</p>`:''}
      <div class="row" style="margin-top:11px" onclick="event.stopPropagation()">
        <button class="btn ghost sm" onclick="VS.tlTab='story';VS.tlMode='chapter';VS.tlChap='${ch.id}';rerender()">View moments →</button></div>
    </div>`}).join('')}</div>`;
}
function tlStatsTab(){
  const evs=S.timeline.filter(e=>!e.archived);
  const past=evs.filter(e=>!isFuture(e));
  const byY={};past.forEach(e=>{const y=(e.date||'').slice(0,4);if(y)byY[y]=(byY[y]||0)+1});
  const years=Object.keys(byY).sort();
  const maxY=Math.max(...Object.values(byY),1);
  const active=[...years].sort((a,b)=>byY[b]-byY[a]).slice(0,3);
  const byCat=tlCats().map(c=>({c,n:past.filter(e=>e.category===c.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const maxC=Math.max(...byCat.map(x=>x.n),1);
  const mini=(cat,title,icon)=>{
    const l=past.filter(e=>e.category===cat).slice(0,6);
    return `<div class="card"><div class="sec-title">${icon} ${title}</div>
      ${l.length?l.map(e=>`<div class="list-item" onclick="editTLEvent('${e.id}')"><div style="flex:1">
        <div class="small" style="font-weight:600">${esc(e.title)}</div></div><span class="tiny muted">${fmtDate(e.date)}</span></div>`).join('')
      :'<p class="small muted">Nothing recorded yet.</p>'}</div>`;
  };
  const counts=[['💼',past.filter(e=>e.category==='career').length,'Career Events'],
    ['🎓',past.filter(e=>e.category==='education').length,'Education'],
    ['🏗️',past.filter(e=>e.category==='project').length,'Major Projects'],
    ['📜',past.filter(e=>e.category==='certification').length+S.certs.length,'Certifications'],
    ['📚',past.filter(e=>e.category==='readingms').length,'Reading Milestones'],
    ['⭐',past.filter(e=>e.category==='turning').length,'Turning Points'],
    ['✨',evs.filter(isFuture).length,'Future Aspirations']];
  return `<div class="grid fade-up d1" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px">
    ${counts.map(([i2,v,l])=>`<div class="card stat" style="text-align:center;align-items:center"><span style="font-size:19px">${i2}</span><span class="v">${v}</span><span class="l">${l}</span></div>`).join('')}</div>
  <div class="grid fade-up d2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">
    <div class="card"><div class="sec-title">📈 Moments by Year</div>
      ${years.length?years.map(y=>`<div class="bar-h"><span class="b-label">${y}</span>
        <div class="pbar" style="flex:1"><i style="width:${Math.round(byY[y]/maxY*100)}%"></i></div>
        <span class="b-val">${byY[y]}</span></div>`).join(''):'<p class="small muted">Add dated moments to see this.</p>'}
      ${active.length?`<div class="divider"></div><p class="tiny muted">Most active: ${active.map(y=>`<b>${y}</b> (${byY[y]})`).join(' · ')}</p>`:''}</div>
    <div class="card"><div class="sec-title">🗂️ Moments by Category</div>
      ${byCat.map(x=>`<div class="bar-h"><span class="b-label">${x.c.icon} ${esc(x.c.name)}</span>
        <div class="pbar" style="flex:1"><i style="width:${Math.round(x.n/maxC*100)}%;background:linear-gradient(90deg,${x.c.color}77,${x.c.color})"></i></div>
        <span class="b-val">${x.n}</span></div>`).join('')||'<p class="small muted">No moments yet.</p>'}</div>
  </div>
  <div class="grid fade-up d3" style="grid-template-columns:1fr 1fr">
    ${mini('career','Career Timeline','💼')}${mini('education','Education Timeline','🎓')}
    ${mini('project','Major Projects','🏗️')}${mini('turning','Turning Points','⭐')}
  </div>`;
}
POST_RENDER.timeline=()=>{
  const items=document.querySelectorAll('.tl-item');
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('seen');io.unobserve(x.target)}}),{threshold:.06,rootMargin:'0px 0px -6% 0px'});
    items.forEach(el=>io.observe(el));
  } else items.forEach(el=>el.classList.add('seen'));
};

/* ---------- chapters & custom categories CRUD ---------- */
const CHAPTER_FIELDS=[
  {k:'title',label:'Chapter Title',full:1,ph:'The Agency Years, University…'},
  {k:'start',label:'From',type:'date'},{k:'end',label:'To (blank = ongoing)',type:'date'},
  {k:'cover',label:'Cover (emoji placeholder)',ph:'📦'},
  {k:'desc',label:'Description',full:1,type:'textarea',rows:2},
  {k:'highlights',label:'Highlights',full:1,type:'textarea',rows:2},
  {k:'reflections',label:'Reflections',full:1,type:'textarea',rows:2},
];
function editChapter(id){
  const ch=id?S.chapters.find(x=>x.id===id):null;
  openModal(formHTML(ch?'Edit Chapter':'New Life Chapter','Chapters group years of your life into a story.',
    CHAPTER_FIELDS,ch,`saveChapter('${id||''}')`,ch?`delItem('chapters','${id}')`:null));
}
function saveChapter(id){
  const v=readForm(CHAPTER_FIELDS);
  if(!v.title.trim())return toast('A title is required','🌸');
  if(id)Object.assign(S.chapters.find(x=>x.id===id),v);
  else S.chapters.push({id:uid(),...v});
  S.chapters.sort((a,b)=>(a.start||'0000').localeCompare(b.start||'0000'));
  toast('Chapter saved','📖');closeModal();touch(false);rerender();
}
const CAT_FIELDS=[
  {k:'name',label:'Category Name',full:1,ph:'Volunteering'},
  {k:'icon',label:'Icon (emoji)',ph:'🤝'},
  {k:'color',label:'Colour (hex)',ph:'#8FBF9F'},
];
function editCat(){
  openModal(formHTML('New Custom Category','Your life, your categories.',CAT_FIELDS,null,'saveCat()'));
}
function saveCat(){
  const v=readForm(CAT_FIELDS);
  if(!v.name.trim())return toast('A name is required','🌸');
  S.customCats.push({id:'cc_'+uid(),name:v.name,icon:v.icon||'✨',color:/^#[0-9a-fA-F]{6}$/.test(v.color)?v.color:'#EFA6C8'});
  toast('Category created','🗂️');closeModal();touch(false);rerender();
}

/* ============================================================
   INIT
   ============================================================ */
initState();
document.documentElement.setAttribute('data-theme',S.profile.theme||'light');
window.addEventListener('hashchange',render);
render();
</script>
